<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Regístrate | SmartFit</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="registro">
  <a class="skip-link" href="#contenido">Saltar al contenido</a>

  <header class="site-header">
    <div class="contenedor-header">
      <a class="logo" href="index.html" aria-label="SmartFit, inicio">
        <span class="logo-nombre">Smart<span>Fit</span></span>
        <span class="logo-lema">Entrena tu mejor versión</span>
      </a>
      <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="nav-principal" aria-label="Abrir menú">☰</button>
      <nav class="nav-principal" id="nav-principal" aria-label="Principal">
        <ul>
          <li><a href="rutina.html">Tu espacio</a></li>
          <li><a href="gimnasios.html">Gimnasios</a></li>
          <li><a href="#">Plan Black</a></li>
          <li><a href="#">Nuestro equipo Smart</a></li>
          <li><a href="#">Promociones</a></li>
          <li><a class="btn-nav" href="registro.html" aria-current="page">¡Inscríbete ya!</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main id="contenido">
    <section class="contenedor contenedor-angosto" aria-labelledby="titulo-registro">
      <div class="banner">
        <h1 id="titulo-registro">Regístrate con tu correo</h1>
      </div>

      <form id="form-registro" class="formulario" novalidate>
        <div class="campo">
          <label for="correo">Indique su correo</label>
          <input type="email" id="correo" name="correo" autocomplete="email" required aria-describedby="error-correo" placeholder="nombre@dominio.com">
          <p class="error" id="error-correo" role="alert"></p>
        </div>

        <div class="campo">
          <label for="password">Su contraseña</label>
          <input type="password" id="password" name="password" autocomplete="new-password" required aria-describedby="error-password" placeholder="Mínimo 8 caracteres, letras y números">
          <p class="error" id="error-password" role="alert"></p>
        </div>

        <div class="acciones-form">
          <button type="button" class="btn btn-rojo" id="btn-olvido">¿Olvidaste tu contraseña?</button>
          <button type="submit" class="btn">Registrarme</button>
        </div>

        <p class="mensaje-estado" id="estado-registro" role="status"></p>
      </form>
    </section>
  </main>

  <footer class="site-footer">
    <div class="contenedor-footer">
      <a class="logo" href="index.html" aria-label="SmartFit, inicio">
        <span class="logo-nombre">Smart<span>Fit</span></span>
      </a>
      <ul>
        <li><a href="gimnasios.html">Gimnasios</a></li>
        <li><a href="rutina.html">Tu espacio</a></li>
        <li><a href="registro.html">Inscríbete</a></li>
      </ul>
      <p>&copy; <span id="anio">2026</span> SmartFit. Proyecto académico.</p>
    </div>
  </footer>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
